name: Java CI with Maven

# 1. Gatilhos: Define quando a pipeline é executada
on:
  push:
    branches: [ "main" ] # Substitua por master se for o caso
  pull_request:
    branches: [ "main" ]

# 2. Definição do Job: Configura a máquina virtual
jobs:
  build:
    runs-on: ubuntu-latest

    # 3. Os seus passos (já estavam corretos)
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven' # Dica: Adicione isto para acelerar testes futuros
        
    - name: Build with Maven
      run: mvn clean package
      env:
        DB_URL: ${{ secrets.DB_URL }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}